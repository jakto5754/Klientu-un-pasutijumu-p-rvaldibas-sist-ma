<!DOCTYPE html>
<html>
<head>
<title>Edit Customer</title>
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<div class="container">
<h1>Edit Customer</h1>
<form method="GET">
<label>Select Customer</label><br><br>
<select name="customer_id">
{% for c in customers %}
<option value="{{ c[0] }}">{{ c[1] }}</option>
{% endfor %}
</select>
<button type="submit">Load Customer</button>
</form>
<hr>
{% if customer %}
<h2>Edit Information</h2>
<form method="POST" action="{{ url_for('update_customer') }}">
<input type="hidden" name="customer_id" value="{{ customer[0] }}">
<label>Full Name</label><br>
<input type="text" name="fullname" value="{{ customer[1] }}"><br><br>
<label>Email</label><br>
<input type="email" name="email" value="{{ customer[2] }}"><br><br>
<button type="submit">Save Changes</button>
</form>
{% endif %}
<br>
<a href="/customers">
<button>Back</button>
</a>
</div>
</body>
</html>
