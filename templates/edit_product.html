<!DOCTYPE html>
<html>
<head>
<title>Edit Customer</title>
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<div class="container">
<h1>Edit Product</h1>
<form method="GET">
<label>Select Product</label><br><br>
<select name="product_id">
{% for c in products %}
<option value="{{ c[0] }}">{{ c[1] }}</option>
{% endfor %}
</select>
<button type="submit">Load Product</button>
</form>
<hr>
{% if product %}
<h2>Edit Information</h2>
<form method="POST" action="{{ url_for('update_product') }}">
<input type="hidden" name="product_id" value="{{ product[0] }}">
<label> Name</label><br>
<input type="text" name="name" value="{{ product[1] }}"><br><br>
<label> Price</label><br>
<input type="number" name="price" value="{{ product[2] }}"><br><br>
<label> Stock</label><br>
<input type="number" name="stock" value="{{ product[3] }}"><br><br>
<label>Supplier</label><br>
<select name="supplier_id">
{% for supplier in suppliers %}
<option value="{{ supplier[0] }}"
{% if supplier[0] == product[4] %}selected{% endif %}>
    {{ supplier[1] }}
</option>
{% endfor %}
</select>
<br><br>
<button type="submit">Save Changes</button>
</form>
{% endif %}
<br>
<a href="/products">
<button>Back</button>
</a>
</div>
</body>
</html>
