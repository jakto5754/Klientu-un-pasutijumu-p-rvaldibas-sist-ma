<!DOCTYPE html>
<html>
<head>
<title>Edit Order</title>
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<div class="container">
<h1>Edit Order</h1>
<form method="GET">
<label>Select Order</label><br><br>
<select name="order_id">
{% for o in orders %}
<option value="{{ o[0] }}">Order #{{ o[0] }}</option>
{% endfor %}
</select>
<button type="submit">Load Order</button>
</form>
<hr>
{% if order %}
<form method="POST" action="{{ url_for('update_order') }}">
<input type="hidden" name="order_id" value="{{ order[0] }}">
<label>Date</label><br>
<input type="date" name="date" value="{{ order[1] }}"><br><br>
<label>Time</label><br>
<input type="time" name="time" value="{{ order[2] }}"><br><br>
<label>Customer</label><br>
<select name="customer_id">
{% for c in customers %}
<option value="{{ c[0] }}"
{% if c[0] == order[3] %}selected{% endif %}>
{{ c[1] }}
</option>
{% endfor %}
</select>
<br><br>
<button type="submit">Save Changes</button>
</form>
{% endif %}
<br>
<a href="/orders"><button>Back</button></a>
</div>
</body>
</html>
